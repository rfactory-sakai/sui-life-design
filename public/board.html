<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUI | PC・モバイル デザイン一覧</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9edf0;color:#142f42;font-family:'Yu Gothic',Meiryo,sans-serif;font-size:13px}header{padding:28px 4%;background:#fff;border-bottom:1px solid #d6dfe4}header>div{display:flex;align-items:center;justify-content:space-between;gap:25px}.brand{font:46px Georgia;letter-spacing:-3px}h1{font-size:21px;font-weight:500;margin:10px 0}p{color:#647782;line-height:1.8;font-size:12px}.badge{font:10px Arial;letter-spacing:.15em;color:#487a99}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}nav a,.tools button{color:#18364b;text-decoration:none;background:#fff;border:1px solid #cad5dc;padding:9px 17px;font:12px inherit;cursor:pointer}nav a:hover,.tools button:hover{border-color:#236f9d}nav a{background:#f3f6f7}.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.tools button[aria-pressed=true]{background:#16374d;color:white}main{padding:10px 4% 50px}.sheet{padding-top:42px;scroll-margin-top:20px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.sheethead h2{font-size:22px;font-weight:500;margin:0}.sheethead small{font:10px Arial;letter-spacing:.12em;color:#6d8494;margin-right:18px}.sheethead a{font-size:11px;color:#315f80;text-underline-offset:4px}.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,27%);gap:28px;align-items:start}.label{display:flex;justify-content:space-between;align-items:center;font:10px Arial;letter-spacing:.12em;color:#607582;margin:0 0 12px}.label span:last-child{font-size:9px}.canvas{overflow:hidden;background:white;box-shadow:0 8px 35px #18374b0d;border:1px solid #d0d9de;border-radius:5px}.chrome{height:24px;background:#fafbfc;border-bottom:1px solid #e1e6e9;display:flex;gap:4px;align-items:center;padding:0 10px}.chrome i{height:5px;width:5px;background:#ccd5da;border-radius:50%}.viewport{position:relative;overflow:hidden}iframe{display:block;border:0;transform-origin:top left;background:white;position:absolute;top:0;left:0}.bottom{margin:20px 0;font-size:10px;color:#78909f}footer{padding:30px 4%;font-size:11px;border-top:1px solid #d0dbe1;color:#607582}@media(max-width:700px){header{padding:24px 5%}header>div{align-items:start}.comparison{grid-template-columns:1fr;gap:30px}.mobile{max-width:390px;width:100%;margin:auto}.sheet{padding-top:35px}main{padding:0 5% 35px}.sheethead{gap:10px}.sheethead h2{font-size:18px}.sheethead small{margin-right:7px;font-size:8px}h1{font-size:18px}.tools{margin-top:20px}.badge{font-size:8px}.label{margin-top:8px}}
</style></head><body><header><div><div><div class="badge">SUI / FRONTEND DESIGN BOARD</div><h1>PC・モバイル デザイン一覧</h1><p>同じデザインを、PC 1440px とモバイル 390px で比較できます。<br>「ページ全体」で下部まで一覧表示。「ファーストビュー」で最初の画面だけを比較できます。</p></div><span class="brand">sui</span></div><div class="tools"><button data-mode="full" aria-pressed="true">ページ全体</button><button data-mode="first" aria-pressed="false">ファーストビュー</button><span id="status" role="status">全5画面 / PC・モバイル</span></div><nav aria-label="画面一覧"><a href="#top">01 トップ</a><a href="#service">02 サービス</a><a href="#works">03 実績・事例</a><a href="#company">04 会社概要</a><a href="#contact">05 お問い合わせ</a></nav></header><main id="board"></main><footer>デザイン確認用の画面一覧です。ブランド・会社情報・事例は仮設定。お問い合わせは送信しないデモです。写真はイメージです。</footer><script>
const pages=[['top','トップ','index.html'],['service','サービス','service.html'],['works','実績・事例','works.html'],['company','会社概要','company.html'],['contact','お問い合わせ','contact.html']];let mode='full';const board=document.getElementById('board');for(const [i,[id,name,file]]of pages.entries()){const s=document.createElement('section');s.className='sheet';s.id=id;s.innerHTML=`<div class="sheethead"><h2><small>0${i+1}</small>${name}</h2><a href="${file}" target="_blank" rel="noopener">実寸で開く ↗</a></div><div class="comparison">${[['desktop','DESKTOP',1440,960],['mobile','MOBILE',390,844]].map(([cls,label,w,h])=>`<div class="${cls}"><div class="label"><span>${label}</span><span>${w} × ${h} / RESPONSIVE</span></div><div class="canvas"><div class="chrome"><i></i><i></i><i></i></div><div class="viewport"><iframe title="${name} ${label} プレビュー" src="${file}?board=1" width="${w}" height="${h}" data-width="${w}" data-height="${h}"></iframe></div></div></div>`).join('')}</div><p class="bottom">${name} / PC・モバイル共通のレスポンシブデザイン</p>`;board.append(s)}
function resize(frame){const width=+frame.dataset.width,base=+frame.dataset.height;const scale=frame.parentElement.clientWidth/width;const height=mode==='full'?(+frame.dataset.fullHeight||base):base;frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform=`scale(${scale})`;frame.parentElement.style.height=Math.ceil(height*scale)+'px'}
const frames=[...document.querySelectorAll('iframe')];for(const f of frames){f.addEventListener('load',()=>{try{const d=f.contentDocument;const css=d.createElement('style');css.textContent='html{scroll-behavior:auto!important}.js .reveal{opacity:1!important;transform:none!important;transition:none!important}.hero *{animation:none!important}.heroimage{transition:none!important}.heroimage+.heroimage{display:none!important}.hero{height:730px!important;min-height:0!important}@media(max-width:640px){.hero{height:642px!important;min-height:0!important}}';d.head.append(css);d.addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();window.open(a.href,'_blank','noopener')}});const measure=()=>{f.dataset.fullHeight=Math.max(d.body.scrollHeight,d.documentElement.scrollHeight);resize(f)};new ResizeObserver(measure).observe(d.body);d.querySelectorAll('img').forEach(im=>im.addEventListener('load',measure));measure()}catch(e){resize(f)}});new ResizeObserver(()=>resize(f)).observe(f.parentElement);resize(f)}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));frames.forEach(resize)}));
</script></body></html>
